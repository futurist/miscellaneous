[package]
name = "mcurl-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mcurl"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "socks"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"
indicatif = "0.17"
anyhow = "1.0"
num_cpus = "1.16"
